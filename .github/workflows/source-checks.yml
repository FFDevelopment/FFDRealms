name: Source Checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run project source checks
        run: |
          python tests/check_project.py
          python tests/check_grammar.py
          python tests/check_frontier.py
          python tests/check_appearance.py
          python tests/check_combat.py
          python tests/check_textures.py
          python tests/check_terrain.py

name: Build Windows Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - "data/**"
      - "shaders/**"
      - ".github/workflows/build-windows-test.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "FFDRealms"

jobs:
  windows:
    name: Windows x86_64 playable build
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Validate project imports
        shell: bash
        run: |
          godot --headless --editor --path . --quit

      - name: Export Windows release
        shell: bash
        run: |
          mkdir -p build/windows
          godot --headless --verbose --path . --export-release "Windows Desktop" "build/windows/FFDRealms.exe"
          test -f build/windows/FFDRealms.exe

      - name: Add tester instructions
        shell: bash
        run: |
          cat > build/windows/README-TEST-BUILD.txt <<'EOF'
          FFDRealms Windows Test Build

          1. Extract this ZIP completely.
          2. Run FFDRealms.exe.
          3. For multiplayer testing, start the separate development backend from the source repository/server folder first.
          4. This is a development build. Back up important saves before testing.
          EOF

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FFDRealms-Windows-Test
          path: build/windows/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
